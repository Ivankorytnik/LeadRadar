name: Expand staged LeadRadar sources

on:
  push:
    branches: [main]
    paths:
      - "staging/**"
      - ".github/workflows/expand-sources.yml"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand staged sources
        run: |
          set -e
          mkdir -p app/static
          cat staging/main.part.* | base64 -d | gzip -d > app/main.py
          cat staging/html.part.* | base64 -d | gzip -d > app/static/index.html
          test -s app/main.py
          test -s app/static/index.html
          rm -rf staging
          rm -f app/main.py.gz.b64 app/static/index.html.gz.b64
          rm .github/workflows/expand-sources.yml
      - name: Commit expanded sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add LeadRadar MVP application source [skip ci]"
          git push
